# Build the published site without committing generated files to the repository.
# Deployments only run from main, after the content has been merged.
name: Build and deploy book

on:
  push:
    branches: [main]
  workflow_dispatch:

# No repository write token is available to the workflow by default.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build fork-aware website and searchable chapter pages
        run: node scripts/build-site.mjs
      - name: Validate published output
        run: |
          test -s _site/index.html
          test -s _site/topics/index.html
          test -s _site/chapters.json
          test -s _site/strategy-metadata.json
          test -s _site/decision-tree.json
          test -s _site/sitemap.xml
      - name: Upload generated website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy reviewed website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
