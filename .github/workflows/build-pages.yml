name: Regenerate searchable chapters
on:
  push:
    branches: [main]
    paths:
      - '*.txt'
      - 'chapters.json'
      - 'seo-content.json'
      - 'scripts/generate-seo.mjs'
      - '.github/workflows/build-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and commit searchable pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A later commit can land while this job is running. Always rebuild
          # from the latest main, and retry without overwriting other changes.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/generate-seo.mjs
            git add topics sitemap.xml
            if git diff --cached --quiet; then
              echo "Searchable pages are already up to date."
              exit 0
            fi
            git commit -m "Regenerate search-friendly chapters"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during generation (attempt ${attempt}); retrying."
          done
          echo "Failed to push generated pages after five attempts." >&2
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
